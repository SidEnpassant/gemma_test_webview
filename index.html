<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On-device assistant</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16181d;
    --muted: #6b7280;
    --line: #e4e6eb;
    --brand: #1a73e8;
    --ok: #0f7b3f;
    --bad: #b3261e;
    --user: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --ink: #e8eaed; --muted: #9aa0a6;
      --line: #2c3038; --brand: #8ab4f8; --ok: #6dd58c; --bad: #f2b8b5;
      --user: #2b4a7d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    background: var(--card); display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #link { margin-left: auto; font-size: 11px; color: var(--muted); }
  #link.on { color: var(--ok); }
  main { flex: 1; overflow-y: auto; padding: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .card h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .spec { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .spec span:first-child { color: var(--muted); }
  .spec span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .verdict { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .verdict.yes { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .verdict.no  { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--brand); color: #fff; padding: 11px 16px; width: 100%;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #10243e; } }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s; }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  /* chat */
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 15px; margin: 6px 0;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { margin-left: auto; background: var(--user); color: #fff; border-bottom-right-radius: 5px; }
  @media (prefers-color-scheme: dark) { .msg.user { color: #e8eaed; } }
  .msg.model { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .msg.action { max-width: 100%; background: var(--card); border: 1px dashed var(--line);
    font-size: 13px; color: var(--muted); }
  .msg.action b { color: var(--ink); font-weight: 600; }
  .msg.action .out { display: block; margin-top: 4px; }
  .msg.action .out.ok { color: var(--ok); }
  .msg.action .out.bad { color: var(--bad); }
  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px;
    border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s }
  .dots span:nth-child(3) { animation-delay: .4s }
  @keyframes b { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }
  footer { border-top: 1px solid var(--line); background: var(--card);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  footer input {
    flex: 1; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 20px; padding: 10px 15px; min-width: 0;
  }
  footer input:disabled { opacity: .6; }
  footer button { width: auto; border-radius: 20px; padding: 10px 18px; }
  #demoFlag { border-color: #b26b00; background: color-mix(in srgb, #b26b00 12%, var(--card));
    color: #8a5200; font-size: 13px; }
  @media (prefers-color-scheme: dark) { #demoFlag { color: #f0bd72; } }
  #link.demo { color: #b26b00; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>On-device assistant</h1>
  <span id="link">connecting…</span>
</header>

<main id="main">
  <section class="card" id="deviceCard">
    <h2>This device</h2>
    <div id="specs"><div class="note">Waiting for the app to send device details…</div></div>
    <div class="verdict" id="verdict" hidden></div>
  </section>

  <section class="card" id="modelCard" hidden>
    <h2>On-device model</h2>
    <div id="modelText" class="note"></div>
    <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
    <div style="margin-top:12px"><button id="prepare">Download model</button></div>
  </section>

  <div id="chat"></div>
</main>

<footer>
  <input id="input" placeholder="Model not ready yet" disabled autocomplete="off">
  <button id="send" disabled>Send</button>
</footer>

<script src="policy.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var device = null;   // raw measurements from the app
  var verdict = null;  // what policy.js made of them
  var status = { state: 'absent', progress: 0, name: 'the model', size: '' };

  // --- page -> app ------------------------------------------------------
  // GemmaHost is injected by the host app. Without it this is just a page.
  function toApp(msg) {
    if (window.GemmaHost && window.GemmaHost.postMessage) {
      window.GemmaHost.postMessage(JSON.stringify(msg));
      return true;
    }
    return false;
  }

  // --- app -> page ------------------------------------------------------
  window.GemmaBridge = {
    receive: function (raw) {
      var msg;
      try { msg = JSON.parse(raw); } catch (e) { return; }
      if (msg.type === 'device') {
        device = msg.device;
        // The app sends measurements; the decision is made here.
        verdict = window.GemmaPolicy.decide(device);
        renderDevice();
        renderModel();
      }
      else if (msg.type === 'status') { status = msg; renderModel(); }
      else if (msg.type === 'transcript') { renderChat(msg); }
    }
  };

  // --- rendering --------------------------------------------------------

  function row(label, value) {
    return '<div class="spec"><span>' + label + '</span><span>' + esc(value) + '</span></div>';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderDevice() {
    if (!device) return;
    var ram = Number(device.ramMB) > 0
      ? window.GemmaPolicy.gb(device.ramMB) + ' GB (' + device.ramMB + ' MB)'
      : 'not reported';
    $('specs').innerHTML =
      row('Model', device.model) +
      row('Manufacturer', device.manufacturer) +
      row('OS', device.os) +
      (device.hardware ? row('Hardware', device.hardware) : '') +
      row('RAM', ram);
    var v = $('verdict');
    v.hidden = false;
    v.className = 'verdict ' + (verdict.capable ? 'yes' : 'no');
    v.textContent = verdict.reason;
  }

  function renderModel() {
    if (!verdict) return;
    // An incapable device is never offered a download, so the app is never
    // asked to fetch one.
    $('modelCard').hidden = !verdict.capable;
    if (!verdict.capable) {
      setComposer(false, 'Model cannot run on this device');
      return;
    }

    var name = status.name || 'the model';
    var pct = Math.round((status.progress || 0) * 100);
    var btn = $('prepare');
    var text = $('modelText');
    $('barWrap').hidden = status.state !== 'downloading';
    $('bar').style.width = pct + '%';
    btn.hidden = false;
    btn.disabled = false;

    if (status.state === 'absent') {
      text.textContent = name + ' · ' + (status.size || '') + ' — not downloaded yet.';
      btn.textContent = 'Download model';
    } else if (status.state === 'downloading') {
      text.textContent = 'Downloading ' + name + ' — ' + pct + '%';
      btn.textContent = 'Downloading…'; btn.disabled = true;
    } else if (status.state === 'installed') {
      text.textContent = name + ' is downloaded.';
      btn.textContent = 'Start the model';
    } else if (status.state === 'loading') {
      text.textContent = 'Starting ' + name + ' on this device…';
      btn.textContent = 'Starting…'; btn.disabled = true;
    } else if (status.state === 'ready') {
      text.textContent = name + ' is running on this device. Nothing you type leaves the phone.';
      btn.hidden = true;
    } else if (status.state === 'error') {
      text.textContent = status.message || 'Something went wrong.';
      btn.textContent = 'Try again';
    }

    var ready = status.state === 'ready';
    setComposer(ready, ready ? 'Message the on-device model' : 'Model not ready yet');
  }

  function setComposer(on, placeholder) {
    $('input').disabled = !on;
    $('send').disabled = !on;
    $('input').placeholder = placeholder;
  }

  function renderChat(msg) {
    var html = '';
    for (var i = 0; i < msg.messages.length; i++) {
      var m = msg.messages[i];
      if (m.role === 'action') {
        html += '<div class="msg action">Ran <b>' + esc(m.call) + '</b>' +
          (m.outcome ? '<span class="out ' + (m.succeeded ? 'ok' : 'bad') + '">' +
            esc(m.outcome) + '</span>' : '') + '</div>';
      } else if (m.text === '' && m.role === 'model') {
        html += '<div class="msg model dots"><span></span><span></span><span></span></div>';
      } else {
        html += '<div class="msg ' + m.role + '">' + esc(m.text) + '</div>';
      }
    }
    $('chat').innerHTML = html;
    $('main').scrollTop = $('main').scrollHeight;
    // The model handles one turn at a time; don't let a second one queue up.
    if (status.state === 'ready') setComposer(!msg.busy,
      msg.busy ? 'Thinking…' : 'Message the on-device model');
  }

  // --- input ------------------------------------------------------------

  $('prepare').addEventListener('click', function () { toApp({ type: 'prepare' }); });

  function send() {
    var text = $('input').value.trim();
    if (!text || $('send').disabled) return;
    $('input').value = '';
    toApp({ type: 'chat', text: text });
  }
  $('send').addEventListener('click', send);
  $('input').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

  // --- handshake --------------------------------------------------------

  if (!window.GemmaPolicy) {
    $('specs').innerHTML = '<div class="note">policy.js did not load, so this ' +
      'page cannot decide anything. Publish it next to index.html.</div>';
    return;
  }

  // The app only starts pushing once it has heard this, so a reload always
  // gets a fresh device profile and the current model status.
  if (toApp({ type: 'ready' })) {
    $('link').textContent = 'connected to app';
    $('link').className = 'on';
  } else {
    $('link').textContent = 'no app';
    $('specs').innerHTML =
      '<div class="note">Open this page from inside the app. On its own it has ' +
      'no way to read the device or reach a model.</div>';
    if (location.search.indexOf('demo') > -1) demo();
  }

  // A fake device + model so the hosted page can be checked in a browser
  // before any app points at it. Unreachable from inside the app: it needs
  // BOTH a missing GemmaHost channel and an explicit ?demo= in the URL, and
  // the app injects the channel and loads the page with no query string.
  function demo() {
    $('link').textContent = 'DEMO DATA';
    $('link').className = 'demo';
    var flag = document.createElement('div');
    flag.className = 'card';
    flag.id = 'demoFlag';
    flag.textContent = 'Demo data. Every number below is invented so the ' +
      'hosted page can be checked without a phone. Inside the app these come ' +
      'from the device itself and none of this code runs.';
    $('main').insertBefore(flag, $('main').firstChild);
    var ram = Number((location.search.match(/ram=(\d+)/) || [])[1] || 6144);
    // Only measurements, exactly like the app sends. The verdict still comes
    // from policy.js, so demo mode exercises the real rule.
    window.GemmaBridge.receive(JSON.stringify({
      type: 'device',
      device: {
        platform: 'android', model: 'Demo Phone', manufacturer: 'Demo',
        os: 'Android 14 (SDK 34)', ramMB: ram, hardware: 'demo',
        lowRamDevice: false
      }
    }));
    var p = 0;
    $('prepare').addEventListener('click', function () {
      var t = setInterval(function () {
        p = Math.min(1, p + 0.07);
        window.GemmaBridge.receive(JSON.stringify({
          type: 'status', state: p < 1 ? 'downloading' : 'ready', progress: p,
          name: 'FunctionGemma 270M', size: '289 MB'
        }));
        if (p >= 1) clearInterval(t);
      }, 120);
    });
  }
})();
</script>
</body>
</html>
